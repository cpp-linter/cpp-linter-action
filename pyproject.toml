[project]
name = "cpp-linter-action"
version = "0.0.0+private_virtual"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
action = [
    "clang-tools==1.3.0",
    "cpp-linter==1.14.1",
]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
]
docs = [
    "markdown-gfm-admonition>=0.1.1",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocs-material>=9.7.7",
    "pyyaml>=6.0.3",
]
test = [
    # the tests exercise the scripts in docs/, so they need the docs dependencies
    { include-group = "docs" },
    "coverage>=7.16.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the docs scripts are not a package; let the tests import them by module name
pythonpath = ["docs"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["docs"]

[tool.coverage.report]
show_missing = true
