[project]
name = "cpp-linter-action"
version = "0.0.0+private_virtual"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
action = [
    "cpp-linter==2.0.0rc23",
]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "ruff>=0.17.1",
]
docs = [
    "markdown-gfm-admonition>=0.1.1",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocs-material>=9.7.7",
    "pyyaml>=6.0.3",
]

[[tool.uv.index]]
name = "testPyPI"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
cpp-linter = { index = "testPyPI" }
