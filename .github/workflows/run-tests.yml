name: Run tests

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'docs/*.py'
      - 'docs/action.yml'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/run-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'action.yml'
      - 'docs/*.py'
      - 'docs/action.yml'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/run-tests.yml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run tests
        run: uv run --no-dev --group test coverage run -m pytest -v

      - name: Report coverage
        run: |
          uv run --no-dev --group test coverage report
          uv run --no-dev --group test coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
