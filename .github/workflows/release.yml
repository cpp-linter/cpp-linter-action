name: Release

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      ref:
        description: 'release tag to point the rolling tag at, e.g. v2.24.1'
        required: true
      tag:
        description: 'rolling tag to update, e.g. v2 (blank = major version of ref)'
        required: false

permissions:
  contents: write

jobs:
  re-tag:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: true # needed for `git push`
        fetch-depth: 0
        ref: ${{ inputs.ref }}
    - name: Config git name and email
      run: |
        git config user.name 'github-actions'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
    - name: Update rolling tag
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_REF: ${{ inputs.ref }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # The rolling tag follows the major version of the published release
        # (or the release tag given as ref), not of the newest tag in the
        # repository: a v2 patch published after v3 must move v2, not v3.
        RELEASE="${RELEASE_TAG:-$INPUT_REF}"
        if ! [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error title=Not a release tag::'${RELEASE}' is not a vX.Y.Z release tag; give the release tag as ref"
          exit 1
        fi
        MAJOR="${RELEASE%%.*}"
        TAG="${INPUT_TAG:-$MAJOR}"
        if [ "$TAG" != "$MAJOR" ]; then
          echo "::error title=Major version mismatch::$TAG cannot point at $RELEASE"
          exit 1
        fi
        # A branch named like the tag would be checked out instead of the tag
        if [ "$(git rev-parse HEAD)" != "$(git rev-parse --verify --quiet "refs/tags/$RELEASE^{commit}")" ]; then
          echo "::error title=Commit mismatch::tag $RELEASE is missing or not the checked out commit"
          exit 1
        fi
        echo "Moving $TAG to $RELEASE ($(git rev-parse --short HEAD))"
        git tag --force --annotate "$TAG" --message "Retag $TAG"
        git push origin "$TAG" --force
