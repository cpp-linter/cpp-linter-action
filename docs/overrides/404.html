{% extends "main.html" %}

{#-
  Gives the 404 page a title of its own, so that missing pages are not counted
  under the home page's title in Google Analytics.
-#}

{% block htmltitle %}
  <title>Page not found - {{ config.site_name }}</title>
{% endblock %}

{% block content %}
  <h1>404 - Not found</h1>
{% endblock %}
